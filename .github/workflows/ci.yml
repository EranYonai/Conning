name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: pytest (coverage gate on Linux, where the sh-based job tests run)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q --cov=conning --cov-report=term-missing --cov-fail-under=95
      - name: pytest
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (D46) and check the server starts in it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: conning:ci
      - run: docker run --rm conning:ci --version
      - name: doctor in the container reports the container and the keychain
        run: |
          out=$(docker run --rm conning:ci doctor || true)
          echo "$out"
          echo "$out" | grep -q "running in a container"
          echo "$out" | grep -q "ssh found"
