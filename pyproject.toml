[project]
name = "conning"
version = "0.6.1"
description = "A control room for your agent's test machines: an MCP server and CLI that run commands on remote targets without the agent ever seeing a secret."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Eran Yonai" }]
requires-python = ">=3.11"
dependencies = [
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
]
keywords = ["mcp", "ssh", "agents", "remote-execution", "testing", "vault"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/EranYonai/Conning"
Issues = "https://github.com/EranYonai/Conning/issues"

[project.scripts]
conn = "conning.cli:main"
conning = "conning.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"  # the e2e tests need a real sshd: uv run pytest -m e2e (see tests/e2e/start-sshd.sh)
markers = ["e2e: end to end against a real OpenSSH server (CI's e2e job)"]
