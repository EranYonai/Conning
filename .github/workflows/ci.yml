name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: pytest (coverage gate on Linux, where the sh-based job tests run)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q --cov=conning --cov-report=term-missing --cov-fail-under=95
      - name: pytest
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest -q
