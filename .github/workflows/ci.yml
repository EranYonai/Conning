name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: pytest (coverage gate on Linux, where the sh-based job tests run)
        if: matrix.os == 'ubuntu-latest'
        run: uv run pytest -q --cov=conning --cov-report=term-missing --cov-fail-under=95
      - name: pytest
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest -q

  e2e:
    # The real `conn` and MCP server against a real OpenSSH server on the runner, no mocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync
      - name: Start a throwaway sshd on 127.0.0.1 as the target
        run: sudo sh tests/e2e/start-sshd.sh "$RUNNER_TEMP/sshd" >> "$GITHUB_ENV"
      - run: uv run --with keyrings.alt pytest -m e2e -v  # a file keychain, for passwords typed at `conn add`
      - name: sshd log
        if: failure()
        run: sudo cat "$RUNNER_TEMP/sshd/sshd.log"

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (D46) and check the server starts in it
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: conning:ci
      - run: docker run --rm conning:ci --version
      - name: doctor in the container reports the container and the keychain
        run: |
          out=$(docker run --rm conning:ci doctor || true)
          echo "$out"
          echo "$out" | grep -q "running in a container"
          echo "$out" | grep -q "ssh found"
      - name: files written to a host folder stay the host user's
        run: |
          mkdir host-conning
          docker run --rm -v "$PWD/host-conning:/conning" conning:ci doctor
          test "$(stat -c %u host-conning/state)" = "$(id -u)"
